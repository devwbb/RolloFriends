[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiosmartfriends"
version = "0.2.0b1"
description = "Async Python client for the SmartFriends Box protocol"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "RolloFriends contributors" }]
keywords = ["smartfriends", "schellenberg", "home-assistant", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "python-dotenv>=1.0",
]
lint = [
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiosmartfriends"]

[tool.hatch.build.targets.sdist]
include = [
  "src/aiosmartfriends",
  "README.md",
  "LICENSE",
  "NOTICE.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:homeassistant.*",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "tests_ha", "custom_components"]
extend-exclude = [
  "custom_components/smartfriends_box/vendor",
  ".venv",
  ".venv-ha",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["aiosmartfriends"]
mypy_path = "src"
